[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dna-regulatory-classifier"
version = "1.0.0"
description = "Beginner-friendly promoter, enhancer, and background DNA classifier"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MU Likhitha"}]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "matplotlib>=3.7,<4",
  "seaborn>=0.12,<1",
  "tensorflow>=2.15,<3",
  "streamlit>=1.36,<2",
]

[project.scripts]
dna-classifier = "dna_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

